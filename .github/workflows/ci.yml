name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # The launcher runtime is packaged separately; compile the bridge host and both test APKs.
      - name: Test
        run: ./gradlew :owl:test :app:testDebugUnitTest :owl:owlJar :app:lintDebug :desktop-host:lintDebug :app:assembleDebugAndroidTest :desktop-host:assembleDebug :desktop-host:assembleDebugAndroidTest

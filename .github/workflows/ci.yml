name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # The NDK app/build.gradle.kts pins; installed up front so AGP doesn't download it mid-build.
      - name: Install the NDK
        run: |
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          [ -d "$ANDROID_HOME/ndk/$ndk" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null

      - name: Test
        run: ./gradlew :owl:test :app:testDebugUnitTest :owl:owlJar

      - name: Install proot build dependencies
        run: sudo apt-get update -q && sudo apt-get install -yq libarchive-tools

      - name: Fetch proot
        run: scripts/fetch-proot.sh

      - name: Build and lint
        run: ./gradlew :app:assembleDebug :app:lintDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: omalauncher-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

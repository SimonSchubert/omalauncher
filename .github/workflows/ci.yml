name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # Unit tests only: a full build needs proot, built by scripts/fetch-proot.sh.
      - name: Test
        run: ./gradlew :owl:test :app:testDebugUnitTest :owl:owlJar

  android-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch the pinned test runtime
        run: python3 scripts/fetch-test-proot.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android commands and storage binds
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew -Pomalauncher.testAbi=x86_64 :app:connectedDebugAndroidTest
            python3 scripts/check-android-test-results.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-integration-results
          path: app/build/outputs/androidTest-results/

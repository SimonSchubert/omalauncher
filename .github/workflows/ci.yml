name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # Unit tests only: a full build needs proot, built by scripts/fetch-proot.sh.
      - name: Test
        run: ./gradlew :owl:test :app:testDebugUnitTest :owl:owlJar

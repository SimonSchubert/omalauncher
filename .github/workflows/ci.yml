name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its run still going; every push to main is tested.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # The NDK app/build.gradle.kts pins; installed up front so AGP doesn't download it mid-build.
      - name: Install the NDK
        run: |
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          [ -d "$ANDROID_HOME/ndk/$ndk" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null

      # libghostty-vt, the built-in terminal's engine: its library and its tests need it. Zig and its cache (the
      # source's packages and what it built) are kept between runs until the script changes.
      - uses: actions/cache@v4
        with:
          path: |
            build/zig
            ~/.cache/zig
          key: ghostty-vt-${{ runner.os }}-${{ hashFiles('scripts/fetch-ghostty-vt.sh') }}

      - name: Build libghostty-vt
        run: scripts/fetch-ghostty-vt.sh

      - name: Test
        run: ./gradlew :owl:test :app:testFossDebugUnitTest :owl:owlJar

      # Builds without proot (scripts/fetch-proot.sh), which is enough to compile wlbridge and run lint.
      # The play build adds Play's in-app updates and their dependencies; linting it too catches what they break.
      - name: Build and lint
        run: ./gradlew :app:assembleFossDebug :app:lintFossDebug :app:lintPlayDebug

      # The log shows only which test failed; its report has the message and the stack trace.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '*/build/reports/tests/'
          if-no-files-found: ignore

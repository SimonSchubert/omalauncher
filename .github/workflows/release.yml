name: release

# Builds a signed APK for a version tag (v0.4.0) and attaches it to a GitHub release.
# The Play Store AAB is still built and uploaded locally with fastlane.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches the app version
        id: version
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_REF_NAME" != "v$name" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match versionName $name" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Fetch proot
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libarchive-tools
          scripts/fetch-proot.sh

      # The upload key, so the APK has the fingerprint assetlinks.json already lists.
      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "The KEYSTORE_* secrets aren't set; the APK would be debug-signed" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build
        run: ./gradlew :app:assembleRelease

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="omalauncher-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          notes=fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.code }}.txt
          [ -f "$notes" ] || notes=/dev/null
          gh release create "$GITHUB_REF_NAME" "$apk" --title "$GITHUB_REF_NAME" --notes-file "$notes" --verify-tag

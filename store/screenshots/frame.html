<!doctype html>
<!-- Play Store screenshots. Rendered one slide at a time by scripts/render-screenshots.sh (frame.html?s=N).
     Each is a capture from scripts/store-captures.sh (1080x1670) under a caption band. -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=block" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  .slide { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'JetBrains Mono', monospace; }
  /* The band is the shot's own top row drawn tall, so its colors run straight on into the screen below. */
  .band { position: absolute; top: 0; left: 0; width: 1080px; height: 250px; background-repeat: no-repeat;
          background-position: top left; background-size: 1080px 417500px; }
  .band::after { content: ''; position: absolute; inset: 0; background: var(--veil); }
  .caption { position: absolute; z-index: 1; left: 64px; right: 64px; bottom: 34px; color: var(--ink);
             font-size: 66px; font-weight: 800; line-height: 1.1; letter-spacing: -2px; }
  .caption em { font-style: normal; color: var(--accent); }
  .shot { position: absolute; top: 250px; left: 0; display: block; width: 1080px; height: 1670px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ink and accent come from each theme's colors (app/src/main/assets/themes/<theme>.toml); veil evens out the
// band under the caption where the top of the wallpaper is busy.
const SLIDES = [
  { shot: '1-home', ink: '#ffffff', accent: '#7aa2f7', veil: 'rgba(26,27,38,0.30)', title: 'Arch Linux on <em>your phone</em>' },
  { shot: '2-face', ink: '#dcd7ba', accent: '#98bb6c', veil: 'transparent', title: 'Home is a <em>terminal</em>' },
  { shot: '3-light', ink: '#4c4f69', accent: '#1e66f5', veil: 'rgba(239,241,245,0.25)', title: '22 themes, <em>one tap</em>' },
  { shot: '4-live', ink: '#C1C497', accent: '#509475', veil: 'rgba(17,28,24,0.30)', title: 'Widgets that <em>move</em>' },
  { shot: '5-store', ink: '#d4be98', accent: '#7daea3', veil: 'transparent', title: 'A <em>widget store</em>' },
  { shot: '6-app', ink: '#d3c6aa', accent: '#7fbbb3', veil: 'transparent', title: '<em>Apps</em> from the store' },
  { shot: '7-linux', ink: '#bebebe', accent: '#e68e0d', veil: 'transparent', title: 'A real <em>terminal</em>' },
  { shot: '8-style', ink: '#e6d9db', accent: '#f38d70', veil: 'transparent', title: 'Make it <em>yours</em>' },
];
const n = +(new URLSearchParams(location.search).get('s') || 1);
const s = SLIDES[n - 1];
const img = `raw/${s.shot}.png`;
document.getElementById('root').innerHTML = `
  <div class="slide" style="--ink:${s.ink};--accent:${s.accent};--veil:${s.veil}">
    <div class="band" style="background-image:url(${img})"><div class="caption">${s.title}</div></div>
    <img class="shot" src="${img}">
  </div>`;
document.title = String(SLIDES.length);
</script>
</body>
</html>

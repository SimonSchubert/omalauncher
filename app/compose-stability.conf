// Read-only collections the app never mutates after handing them to a composable:
// compare them by value, so pages and lists that didn't change skip recomposition.
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set
java.io.File
// Immutable, compared by package and class: apps and pinned shortcuts that name one stay comparable by value.
android.content.ComponentName
// Immutable, compared by user id: apps from a work profile stay comparable by value too.
android.os.UserHandle
